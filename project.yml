name: LingoLama
options:
  bundleIdPrefix: com.fberger
  deploymentTarget:
    iOS: "17.0"
packages:
  VokabelKit:
    path: VokabelKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    DEVELOPMENT_TEAM: ""
targets:
  LingoLama:
    type: application
    platform: iOS
    sources:
      - App
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    dependencies:
      - package: VokabelKit
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: LingoLama
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Damit dein Lernbegleiter hören kann, wie du ein englisches Wort aussprichst.
        NSSpeechRecognitionUsageDescription: Die Spracherkennung prüft direkt auf dem Gerät, ob du das Wort richtig gesagt hast.
        ProxyHost: $(PROXY_HOST)
        AppToken: $(APP_TOKEN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fberger.lingolama
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
